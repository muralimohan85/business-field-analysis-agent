[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "business-field-analysis-agent"
version = "0.1.0"
description = "A fact-based business field analysis agent: open databases and your documents in, a cited PESTLE-to-recommendations report out."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Murali Mohan" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.70",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "matplotlib>=3.8",
  "pillow>=10",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bfa = "bfa.__main__:main"

[tool.setuptools.packages.find]
include = ["bfa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ui.py" = ["E501"]        # CSS
